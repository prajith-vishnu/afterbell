<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AfterBell — every spot filled</title>
  <meta name="description" content="AfterBell groups students who need rides by neighborhood and by when their activities start and end, so one car can serve band, volleyball and theater on the same trip." />
  <meta name="author" content="Prajith Vishnu, Braswell High School" />
  <meta name="theme-color" content="#C24A00" />

  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./favicon.svg" />

  <!-- One typeface for the whole app. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Leaflet, for the OpenStreetMap views. No API key. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="app">

    <div class="demobar" id="demobar" hidden></div>

    <main id="main" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.js"></script>
  <script type="module" src="./js/app.js"></script>

</html>
