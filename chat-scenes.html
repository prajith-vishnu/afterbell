<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trumpets — chat scenes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
/* ===========================================================================
   AfterBell — chat-scenes.html
   The two group-chat scenes, on their own, for recording separately.
   ===========================================================================
   The same two scenes also play inside film mode as segments 1 and 15. This
   page exists so they can be shot on their own — bigger, slower, or retaken
   without re-running the whole film.

   SELF-CONTAINED ON PURPOSE: no imports and no modules, so this one file can
   be opened by double-clicking it. Everything it needs is below.

   >>> IF YOU EDIT THE MESSAGES, EDIT THEM IN BOTH PLACES <<<
   The film keeps its own copy in js/film.js under CONFIG.chats, because the
   film's spec asks for every caption and every timing to live in one config
   object. Keep the two lists identical or the film and this page will drift.

   It is a GENERIC group chat — no copy of any real messaging app's layout,
   colours or wordmark. It uses AfterBell's own palette and typeface.
=========================================================================== */

* { box-sizing: border-box; }

:root {
  --black: #1A1A1A;
  --white: #FFFFFF;
  --peach: #FFF5EF;
  --surface: #FFF5EF;
  --line: #F0E6DE;
  --muted: #8C8C8C;
  --orange: #FF6A13;
  --orange-deep: #E85A00;
  --orange-tint: #FFE9DC;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--peach);
  font-family: var(--font); color: var(--black);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding: 24px 16px;
}

/* --------------------------------------------------------------------------
   THE PHONE — a generic rounded rectangle, not any real device.
   -------------------------------------------------------------------------- */
.phone {
  width: 408px; max-width: 100%;
  height: min(760px, calc(100vh - 150px));
  background: var(--white); border-radius: 40px; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 24px 60px rgba(26, 26, 26, 0.16);
}

.bar {
  display: flex; align-items: center; gap: 12px; flex: none;
  padding: 16px; border-bottom: 1px solid var(--line);
}
.bar__avatar {
  width: 40px; height: 40px; border-radius: 50%; flex: none;
  background: var(--orange-tint); color: var(--orange-deep);
  display: grid; place-items: center; font-weight: 700;
}
.bar__name { margin: 0; font-size: 17px; font-weight: 700; }
.bar__sub { margin: 1px 0 0; font-size: 13px; color: var(--muted); }

.thread {
  flex: 1; overflow-y: auto; padding: 16px 14px 22px;
  display: flex; flex-direction: column; gap: 14px; scrollbar-width: none;
}
.thread::-webkit-scrollbar { display: none; }
.day { align-self: center; font-size: 12px; font-weight: 700; color: var(--muted); }

/* A "run" is consecutive messages from one person: name and avatar once. */
.run { display: flex; gap: 9px; align-items: flex-start; }
.run--me { justify-content: flex-end; }
.run--me .run__body { align-items: flex-end; }
.run--me .run__head { margin: 0 12px 0 0; }
.run__who {
  width: 30px; height: 30px; border-radius: 50%; flex: none; color: #fff;
  display: grid; place-items: center; font-size: 12px; font-weight: 700;
  /* Level with the name above the first bubble, not the last one. */
  margin-top: 20px;
}
.run__body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.run__head {
  display: flex; gap: 8px; align-items: baseline; margin-left: 12px;
  font-size: 12px; color: var(--muted);
}
.run__head span:first-child { font-weight: 700; }

.bubble {
  align-self: flex-start; max-width: 272px;
  background: var(--surface); border-radius: 20px; padding: 10px 14px;
  font-size: 16px; line-height: 1.35; overflow-wrap: break-word;
}
/* Marcus's own messages, because this is Marcus's phone. */
.bubble--me { align-self: flex-end; background: var(--orange-tint); }

/* Shouting gets a small shake. */
.bubble--shout { font-weight: 700; animation: shake 420ms ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-3px); } 30% { transform: translateX(3px); }
  45% { transform: translateX(-2px); } 60% { transform: translateX(2px); }
}

/* Typing indicator, which then becomes the message. */
.bubble--typing { padding: 13px 15px; }
.dots { display: inline-flex; gap: 4px; align-items: center; }
.dots i {
  width: 7px; height: 7px; border-radius: 50%; background: #C9BFB7;
  animation: blink 1.1s infinite ease-in-out;
}
.dots i:nth-child(2) { animation-delay: .18s; }
.dots i:nth-child(3) { animation-delay: .36s; }
@keyframes blink {
  0%, 60%, 100% { opacity: .35; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

/* --------------------------------------------------------------------------
   CONTROLS — outside the phone, so they crop out. H hides them entirely.
   -------------------------------------------------------------------------- */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.controls[hidden] { display: none; }
.btn {
  font: inherit; font-size: 14px; font-weight: 600;
  min-height: 44px; padding: 0 18px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--white); color: var(--black); cursor: pointer;
}
.btn:hover { border-color: var(--orange); }
.btn[aria-pressed="true"] { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn:focus-visible { outline: 2px solid var(--orange-deep); outline-offset: 2px; }
.hint { width: 100%; text-align: center; font-size: 13px; color: var(--muted); margin: 2px 0 0; }

@media (prefers-reduced-motion: reduce) {
  .bubble, .bubble--shout { transition: none; animation: none; }
  .dots i { animation: none; opacity: .6; }
}
</style>
</head>
<body>

  <div class="phone">
    <header class="bar">
      <span class="bar__avatar" aria-hidden="true">T</span>
      <div>
        <h1 class="bar__name">Trumpets 🎺 (8)</h1>
        <p class="bar__sub">8 members</p>
      </div>
    </header>
    <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Group chat"></div>
  </div>

  <div class="controls" id="controls">
    <button class="btn" data-scene="1" aria-pressed="false">Scene 1 — 5:48 AM</button>
    <button class="btn" data-scene="2" aria-pressed="false">Scene 2 — 6:27 AM</button>
    <button class="btn" id="replay">Replay</button>
    <button class="btn" id="hide">Hide controls</button>
    <p class="hint"><strong>1</strong> and <strong>2</strong> play a scene ·
      <strong>R</strong> replays · <strong>H</strong> hides these ·
      add <strong>?manual=1</strong> to the URL to advance with Space</p>
  </div>

<script>
/* ===========================================================================
   THE SCENES
   These must stay identical to CONFIG.chats in js/film.js.
   [sender, text, clock]
=========================================================================== */
const SCENES = {
  1: [
    ['Maya',   'area rehearsal at 6:30, bus to the contest leaves at 9', '5:48 AM'],
    ['Maya',   'everyone up?? reply here', '5:48 AM'],
    ['Chris',  'here 😴', '5:49 AM'],
    ['Maya',   '…marcus?', '5:51 AM'],
    ['Marcus', 'i’m up but i don’t have a ride 😭', '5:52 AM'],
    ['Marcus', 'my mom left for work at 5', '5:52 AM'],
    ['Maya',   'MARCUS IT’S AREA', '5:53 AM'],
    ['Dev',    'spot 14 can’t be empty at area bro', '5:53 AM'],
    ['Ari',    'my mom’s car is already full 😭', '5:54 AM'],
    ['Maya',   'WHO IS DRIVING MARCUS', '5:54 AM'],
    ['Dev',    'bro just get AfterBell', '5:55 AM'],
    ['Dev',    'my neighbor takes her daughter to volleyball at 6:30 and she drives people on it', '5:55 AM'],
    ['Marcus', 'getting it rn', '5:56 AM'],
  ],
  2: [
    ['Marcus', 'HERE 🏃', '6:27 AM'],
    ['Marcus', 'got a ride with dev’s neighbor and her daughter from volleyball lol', '6:27 AM'],
    ['Dev',    'told you 😎', '6:28 AM'],
    ['Maya',   'MARCUS!!!', '6:28 AM'],
    ['Chris',  'spot 14 is FILLED 🙏', '6:29 AM'],
    ['Maya',   'ok everyone on the field', '6:29 AM'],
  ],
};

/* Pacing. Matches the film; change it here to retime this page on its own. */
const GAP_MS = 1000;          // between messages (matches the film)
const TYPE_BASE_MS = 500;     // typing indicator, plus per character
const TYPE_PER_CHAR_MS = 20;
const TYPE_MAX_MS = 1500;

/* Muted, non-branded avatar colours, one per person. */
const PEOPLE = {
  Maya: '#C2410C', Chris: '#5E6B72', Dev: '#6E6480', Ari: '#6B7A5E', Marcus: '#8A6356',
};

/* This is Marcus's phone, so his own messages sit on the right with no name
   and no avatar, the way your own messages look in any group chat. */
const ME = 'Marcus';

/* ?manual=1 — nothing plays on its own; Space reveals the next message. */
const MANUAL = new URLSearchParams(location.search).get('manual') === '1';

const thread = document.getElementById('thread');
const controls = document.getElementById('controls');
if (MANUAL) controls.hidden = true;

let runToken = 0;
let currentScene = null;
let currentRun = null;
let currentSender = null;
let releaseStep = null;

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
const waitForSpace = () => new Promise((resolve) => { releaseStep = resolve; });

const typingMsFor = (text) =>
  Math.min(TYPE_MAX_MS, TYPE_BASE_MS + text.length * TYPE_PER_CHAR_MS);

/** Shouting: four or more letters, none of them lowercase. */
function isShout(text) {
  const letters = text.replace(/[^A-Za-z]/g, '');
  return letters.length >= 4 && letters === letters.toUpperCase();
}

async function play(sceneId) {
  const messages = SCENES[sceneId];
  if (!messages) return;

  const token = ++runToken;   // anything still running stops here
  releaseStep = null;         // drop a gate left over from the last scene
  currentScene = sceneId;
  currentRun = null;
  currentSender = null;

  thread.innerHTML = '';
  for (const button of controls.querySelectorAll('[data-scene]')) {
    button.setAttribute('aria-pressed', String(button.dataset.scene === String(sceneId)));
  }

  const day = document.createElement('div');
  day.className = 'day';
  day.textContent = 'Today';
  thread.appendChild(day);

  if (!MANUAL) {
    await wait(450);
    if (token !== runToken) return;
  }

  for (const [sender, text, clock] of messages) {
    if (MANUAL) {
      await waitForSpace();
      if (token !== runToken) return;
    }

    const bubble = openBubble(sender, clock);
    await wait(typingMsFor(text));
    if (token !== runToken) return;

    fillBubble(bubble, text);

    if (!MANUAL) {
      await wait(GAP_MS);
      if (token !== runToken) return;
    }
  }
}

/** Show a typing bubble, starting a new run if the speaker changed. */
function openBubble(sender, clock) {
  const mine = sender === ME;

  if (sender !== currentSender) {
    currentSender = sender;

    currentRun = document.createElement('div');
    currentRun.className = mine ? 'run run--me' : 'run';

    const body = document.createElement('div');
    body.className = 'run__body';

    const head = document.createElement('div');
    head.className = 'run__head';
    head.innerHTML = '<span></span><span></span>';
    head.children[0].textContent = mine ? '' : sender;
    head.children[1].textContent = clock;
    body.appendChild(head);

    if (mine) {
      currentRun.append(body);
    } else {
      const who = document.createElement('div');
      who.className = 'run__who';
      who.style.background = PEOPLE[sender] || '#777';
      who.textContent = sender[0];
      who.setAttribute('aria-hidden', 'true');
      currentRun.append(who, body);
    }

    thread.appendChild(currentRun);
  }

  const bubble = document.createElement('div');
  bubble.className = mine ? 'bubble bubble--me bubble--typing' : 'bubble bubble--typing';
  bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  currentRun.querySelector('.run__body').appendChild(bubble);

  thread.scrollTop = thread.scrollHeight;
  return bubble;
}

/** The typing bubble becomes the message. */
function fillBubble(bubble, text) {
  bubble.classList.remove('bubble--typing');
  bubble.textContent = text;
  if (isShout(text)) bubble.classList.add('bubble--shout');
  thread.scrollTop = thread.scrollHeight;
}

controls.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.scene) play(Number(button.dataset.scene));
  if (button.id === 'replay' && currentScene) play(currentScene);
  if (button.id === 'hide') controls.hidden = true;
});

// In manual mode the scene is armed on load, so the first Space shows the
// first message rather than only starting the scene.
if (MANUAL) play(1);

document.addEventListener('keydown', (event) => {
  if (MANUAL && event.code === 'Space') {
    event.preventDefault();
    if (releaseStep) {
      const release = releaseStep;
      releaseStep = null;
      release();
    } else if (!currentScene) {
      play(1);
    }
    return;
  }
  if (event.key === '1') play(1);
  if (event.key === '2') play(2);
  if (event.key.toLowerCase() === 'r' && currentScene) play(currentScene);
  if (event.key.toLowerCase() === 'h') controls.hidden = !controls.hidden;
});
</script>
</body>
</html>
