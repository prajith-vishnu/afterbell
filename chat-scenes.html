<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trumpets — chat scenes</title>
<style>
/* ===========================================================================
   AfterBell — chat-scenes.html
   A prop for the demo video. Not part of the app: no imports, no shared data.
   Open it, hit record, press 1 or 2.

   Deliberately a GENERIC phone group chat — grey bubbles, no tails, no blue,
   no copy of any real messaging app's layout, colours or wordmark.

   Controls sit OUTSIDE the phone so they crop out. Press H to hide them
   entirely and drive it from the keyboard.
=========================================================================== */
* { box-sizing: border-box; }

:root {
  --backdrop: #CFCBC6;
  --phone: #FFFFFF;
  --thread: #F7F6F4;
  --bubble: #E6E3DF;
  --ink: #15161A;
  --ink-soft: #6B6761;
  --line: #E2DFDB;
}

html, body { height: 100%; }
body {
  margin: 0; background: var(--backdrop);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 24px 16px;
}

/* --- the phone ---------------------------------------------------------- */
.phone {
  width: 390px; max-width: 100%;
  height: min(780px, calc(100vh - 140px));
  background: var(--phone); border-radius: 28px; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
}

.bar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-bottom: 1px solid var(--line); flex: none;
}
.bar__back { width: 26px; height: 26px; flex: none; color: var(--ink-soft); }
.bar__avatar {
  width: 38px; height: 38px; flex: none; border-radius: 50%;
  background: #D9D5D0; color: #4A453F;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; font-weight: 600;
}
.bar__name { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.bar__sub { margin: 1px 0 0; font-size: 12px; color: var(--ink-soft); }

/* --- the thread --------------------------------------------------------- */
.thread {
  flex: 1; overflow-y: auto; background: var(--thread);
  padding: 16px 14px 20px;
  display: flex; flex-direction: column; gap: 14px;
  scrollbar-width: none;
}
.thread::-webkit-scrollbar { display: none; }

.daystamp {
  align-self: center; font-size: 11.5px; font-weight: 600;
  color: var(--ink-soft); letter-spacing: 0.02em;
}

/* A "run" is consecutive messages from one person: name and avatar once. */
.run { display: flex; gap: 9px; align-items: flex-end; }
.run__avatar {
  width: 28px; height: 28px; flex: none; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 700; color: #FFFFFF; margin-bottom: 1px;
}
.run__body { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.run__head {
  display: flex; align-items: baseline; gap: 8px; margin-left: 12px;
  font-size: 11.5px; color: var(--ink-soft);
}
.run__name { font-weight: 600; }
.run__time { font-size: 11px; }

.bubble {
  align-self: flex-start; max-width: 252px;
  background: var(--bubble); color: var(--ink);
  border-radius: 18px; padding: 9px 13px;
  font-size: 15px; line-height: 1.35; overflow-wrap: break-word;
  /* The entrance is a class we take away, so the resting state is "visible".
     A keyframe starting at opacity 0 can get stuck there if it never runs. */
  transition: opacity 180ms ease-out, transform 180ms ease-out;
}
.bubble--enter { opacity: 0; transform: translateY(6px) scale(0.98); }

/* Shouting gets a tiny shake. */
.bubble--shout { font-weight: 600; animation: shake 420ms ease-in-out; }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  15% { transform: translateX(-3px); }
  30% { transform: translateX(3px); }
  45% { transform: translateX(-2px); }
  60% { transform: translateX(2px); }
  80% { transform: translateX(-1px); }
}

/* Typing indicator, which then becomes the message. */
.bubble--typing { padding: 12px 14px; }
.dots { display: inline-flex; gap: 4px; align-items: center; }
.dots i {
  width: 7px; height: 7px; border-radius: 50%;
  background: #A8A49E; animation: blink 1.1s infinite ease-in-out;
}
.dots i:nth-child(2) { animation-delay: 0.18s; }
.dots i:nth-child(3) { animation-delay: 0.36s; }
@keyframes blink {
  0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-3px); }
}

/* Decorative composer so the screen does not look cut off. */
.composer {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: 12px 14px 16px; border-top: 1px solid var(--line);
}
.composer__field {
  flex: 1; border: 1px solid var(--line); border-radius: 999px;
  padding: 10px 16px; font-size: 14px; color: #A8A49E;
}
.composer__send {
  width: 34px; height: 34px; flex: none; border-radius: 50%;
  background: #D9D5D0; color: #6B6761;
  display: flex; align-items: center; justify-content: center;
}

/* --- controls, outside the phone ---------------------------------------- */
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.controls[hidden] { display: none; }
.btn {
  font: inherit; font-size: 13.5px; font-weight: 600;
  min-height: 40px; padding: 0 16px; border-radius: 999px;
  border: 1px solid #B4AFA9; background: #F0EEEB; color: var(--ink); cursor: pointer;
}
.btn:hover { background: #FFFFFF; }
.btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #FFFFFF; }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.hint { width: 100%; text-align: center; font-size: 12px; color: #6B6761; margin: 2px 0 0; }

@media (prefers-reduced-motion: reduce) {
  .bubble, .bubble--shout { transition: none; animation: none; }
  .dots i { animation: none; opacity: 0.6; }
}
</style>
</head>
<body>

  <div class="phone">
    <header class="bar">
      <svg class="bar__back" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
      </svg>
      <div class="bar__avatar" aria-hidden="true">T</div>
      <div>
        <h1 class="bar__name">Trumpets 🎺 (8)</h1>
        <p class="bar__sub">8 members</p>
      </div>
    </header>

    <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Group chat"></div>

    <div class="composer" aria-hidden="true">
      <div class="composer__field">Message</div>
      <div class="composer__send">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7" />
        </svg>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="btn" data-scene="1" aria-pressed="false">Scene 1 — the hole in the form</button>
    <button class="btn" data-scene="2" aria-pressed="false">Scene 2 — spot 14 is back</button>
    <button class="btn" id="replay">Replay</button>
    <button class="btn" id="hide">Hide controls</button>
    <p class="hint">Keys: <strong>1</strong> and <strong>2</strong> play a scene ·
      <strong>R</strong> replays · <strong>H</strong> hides these buttons</p>
  </div>

<script>
/* ===========================================================================
   THE SCRIPT
   [sender, text, clock]. Consecutive messages from one person group into a
   run, so the name and time show once per run, the way a real chat does.
=========================================================================== */
const SCENES = {
  1: {
    stamp: 'Today',
    messages: [
      ['Maya',   'ok warmup in 8 minutes, everyone on the field', '6:52 AM'],
      ['Maya',   'roll call. reply here', '6:52 AM'],
      ['Chris',  'here', '6:53 AM'],
      ['Dev',    'here 🎺', '6:53 AM'],
      ['Ari',    'here (barely awake)', '6:53 AM'],
      ['Maya',   '…marcus?', '6:54 AM', { before: 1200 }],
      ['Maya',   'marcus', '6:54 AM'],
      ['Chris',  'he was online at like 6:30', '6:55 AM'],
      ['Maya',   'we’re running the company front today we CANNOT have a hole in it', '6:55 AM'],
      ['Dev',    'spot 14 is literally just empty rn', '6:56 AM'],
      ['Maya',   'WHERE IS MARCUS', '6:56 AM', { before: 1500 }],
      ['Marcus', 'im here!! well. at home', '6:57 AM'],
      ['Marcus', 'my mom’s at work and the bus doesn’t run this early 😭', '6:57 AM'],
      ['Marcus', 'i’ve been standing outside with my trumpet for 20 min', '6:57 AM'],
      ['Ari',    'i’d get him but i just got my license, i can only have 1 person in my car and my sister’s already riding with me', '6:58 AM'],
      ['Maya',   'so we’re just doing the show with a hole in it??', '6:58 AM'],
      ['Chris',  'mr. director is gonna lose it 💀', '6:59 AM'],
    ],
  },
  2: {
    stamp: 'Today',
    messages: [
      ['Marcus', 'UPDATE', '7:01 AM'],
      ['Marcus', 'got an AfterBell ride', '7:01 AM'],
      ['Marcus', 'it’s dev’s neighbor + some girl from volleyball lol', '7:01 AM'],
      ['Marcus', 'pulling up in 2', '7:02 AM'],
      ['Dev',    'WAIT my neighbor??', '7:02 AM'],
      ['Maya',   'MARCUS!!!', '7:02 AM', { before: 1500 }],
      ['Chris',  'spot 14 is BACK 🙏', '7:03 AM'],
      ['Ari',    'the form is complete', '7:03 AM'],
      ['Maya',   'ok everyone on the field. NOW', '7:03 AM'],
    ],
  },
};

/* Muted, non-branded avatar colours, one per person. */
const PEOPLE = {
  Maya:   '#8A6F63',
  Chris:  '#5E6B72',
  Dev:    '#6E6480',
  Ari:    '#6B7A5E',
  Marcus: '#8A6356',
};

/* Pacing, all in one place so it is easy to retime for a recording. */
const BASE_GAP_MS = 1600;            // between messages
const TYPING_BASE_MS = 600;          // before a message appears
const TYPING_PER_CHAR_MS = 30;
const TYPING_MAX_MS = 2000;

/* ?manual=1 — nothing plays on its own; Space reveals the next message.
   Useful when the voiceover needs to land before the next line does. */
const MANUAL = new URLSearchParams(location.search).get('manual') === '1';

const thread   = document.getElementById('thread');
const controls = document.getElementById('controls');
if (MANUAL) controls.hidden = true;

/* In manual mode each message waits here until Space is pressed. */
let releaseStep = null;
function waitForSpace() {
  return new Promise((resolve) => { releaseStep = resolve; });
}

let runToken = 0;
let currentScene = null;
let currentRun = null;
let currentSender = null;

const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

/** Shouting: four or more letters and no lowercase among them. */
function isShout(text) {
  const letters = text.replace(/[^A-Za-z]/g, '');
  return letters.length >= 4 && letters === letters.toUpperCase();
}

async function play(sceneId) {
  const scene = SCENES[sceneId];
  if (!scene) return;

  const token = ++runToken;     // anything still running stops here
  releaseStep = null;           // drop any gate left over from the last scene
  currentScene = sceneId;
  currentRun = null;
  currentSender = null;

  thread.innerHTML = '';
  for (const button of controls.querySelectorAll('[data-scene]')) {
    button.setAttribute('aria-pressed', String(button.dataset.scene === String(sceneId)));
  }

  const stamp = document.createElement('div');
  stamp.className = 'daystamp';
  stamp.textContent = scene.stamp;
  thread.appendChild(stamp);

  await wait(450);
  if (token !== runToken) return;

  for (const [sender, text, clock, opts = {}] of scene.messages) {
    // A longer message takes longer to type, up to a ceiling.
    const typingMs = Math.min(TYPING_MAX_MS, TYPING_BASE_MS + text.length * TYPING_PER_CHAR_MS);

    if (MANUAL) {
      // Wait for Space, then type and show. The pauses in the table are a
      // pacing aid for autoplay; here the pacing is in your hands.
      await waitForSpace();
      if (token !== runToken) return;

      const bubble = openBubble(sender, clock);
      await wait(typingMs);
      if (token !== runToken) return;
      fillBubble(bubble, text);
      continue;
    }

    if (opts.before) {
      await wait(opts.before);
      if (token !== runToken) return;
    }

    const bubble = openBubble(sender, clock);
    await wait(typingMs);
    if (token !== runToken) return;

    fillBubble(bubble, text);

    await wait(BASE_GAP_MS + (opts.after || 0));
    if (token !== runToken) return;
  }
}

/** Show a typing bubble, starting a new run if the speaker changed. */
function openBubble(sender, clock) {
  if (sender !== currentSender) {
    currentSender = sender;

    currentRun = document.createElement('div');
    currentRun.className = 'run';

    const avatar = document.createElement('div');
    avatar.className = 'run__avatar';
    avatar.style.background = PEOPLE[sender] || '#777';
    avatar.textContent = sender[0];
    avatar.setAttribute('aria-hidden', 'true');

    const body = document.createElement('div');
    body.className = 'run__body';

    const head = document.createElement('div');
    head.className = 'run__head';
    head.innerHTML =
      `<span class="run__name"></span><span class="run__time"></span>`;
    head.querySelector('.run__name').textContent = sender;
    head.querySelector('.run__time').textContent = clock;
    body.appendChild(head);

    currentRun.append(avatar, body);
    thread.appendChild(currentRun);
  }

  const bubble = document.createElement('div');
  bubble.className = 'bubble bubble--typing';
  bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  currentRun.querySelector('.run__body').appendChild(bubble);

  scrollToEnd();
  return bubble;
}

/** The typing bubble becomes the message. */
function fillBubble(bubble, text) {
  bubble.classList.remove('bubble--typing');
  bubble.classList.add('bubble--enter');
  bubble.textContent = text;
  if (isShout(text)) bubble.classList.add('bubble--shout');

  // A timer rather than requestAnimationFrame: rAF gets throttled in a
  // background or recorded tab, and the bubble would never appear.
  setTimeout(() => bubble.classList.remove('bubble--enter'), 20);
  scrollToEnd();
}

function scrollToEnd() { thread.scrollTop = thread.scrollHeight; }

controls.addEventListener('click', (event) => {
  const button = event.target.closest('button');
  if (!button) return;
  if (button.dataset.scene) play(Number(button.dataset.scene));
  if (button.id === 'replay' && currentScene) play(currentScene);
  if (button.id === 'hide') controls.hidden = true;
});

// In manual mode the scene is armed on load, so the very first Space shows
// the first message rather than only starting the scene.
if (MANUAL) play(1);

document.addEventListener('keydown', (event) => {
  if (MANUAL && event.code === 'Space') {
    event.preventDefault();
    if (releaseStep) {
      const release = releaseStep;
      releaseStep = null;
      release();
    } else if (!currentScene) {
      play(1);
    }
    return;
  }
  if (event.key === '1') play(1);
  if (event.key === '2') play(2);
  if (event.key.toLowerCase() === 'r' && currentScene) play(currentScene);
  if (event.key.toLowerCase() === 'h') controls.hidden = !controls.hidden;
});
</script>
</body>
</html>
