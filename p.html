<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}iframe{border:0;width:1000px;height:820px}pre{font:11px monospace;white-space:pre-wrap}</style></head><body>
<iframe id="f" src="/index.html?demo=1"></iframe><pre id="o"></pre>
<script>
var f=document.getElementById('f'),L=[],errs=[];
f.onload=function(){var d=f.contentDocument,w=f.contentWindow;
 w.addEventListener('error',function(e){errs.push('ERR '+e.message+' :'+e.lineno);});
 w.addEventListener('unhandledrejection',function(e){errs.push('REJ '+(e.reason&&e.reason.message||e.reason));});
 setTimeout(function(){ d.dispatchEvent(new KeyboardEvent('keydown',{key:'h',bubbles:true})); run(d,0); }, 1500);
};
function T(sel,root){var e=(root||f.contentDocument).querySelector(sel);return e?e.textContent.replace(/\s+/g,' ').trim():'(none)';}
function snap(d,n){
 var tag=T('#pres-beat',d);
 var extra='';
 if(d.querySelector('.dial__num')) extra=' dial='+T('.dial__num',d)+' filled='+d.querySelectorAll('.dial__tick.is-filled').length+'/'+d.querySelectorAll('.dial__tick').length;
 if(d.querySelector('.handoff__code')) extra+=' codes='+JSON.stringify([].slice.call(d.querySelectorAll('.handoff__code')).map(function(e){return e.textContent.trim();}));
 if(d.querySelector('.status')) extra+=' status='+T('.status',d);
 if(d.querySelector('[data-seatcount]')) extra+=' seats='+T('[data-seatcount]',d);
 if(d.querySelector('.person__act')) extra+=' acts='+JSON.stringify([].slice.call(d.querySelectorAll('.person__act')).map(function(e){return e.textContent.trim();}));
 if(d.querySelector('.pres__filled')) extra+=' FILLED-LABEL';
 if(d.querySelector('.pres__export')) extra+=' EXPORT-SHEET rows='+d.querySelectorAll('.pres__export tbody tr').length;
 if(d.querySelector('.setting--danger')) extra+=' delete-row=yes';
 L.push(('beat '+(n+1)).padEnd(8)+tag.slice(0,46).padEnd(48)+extra);
}
function run(d,n){
 if(n>=11){ L.push('--- errors --- '+(errs.length?errs.join(' | '):'(none)'));
   // back arrow must not replay
   d.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowLeft',bubbles:true}));
   setTimeout(function(){ L.push('after Left: '+T('#pres-beat',d).slice(0,40));
     document.getElementById('o').textContent=['@@','R','@@'].join('')+'\n'+L.join('\n')+'\n'+['@@','E','@@'].join('');},900);
   return; }
 setTimeout(function(){
   snap(d,n);
   d.dispatchEvent(new KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true}));
   run(d,n+1);
 }, 3400);
}
</script></body></html>
